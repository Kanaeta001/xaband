<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <!-- Holographic gradient -->
    <linearGradient id="holoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#ffd93d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6bcb77;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#4d96ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gold gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F7DC6F" />
      <stop offset="50%" style="stop-color:#D4AC0D" />
      <stop offset="100%" style="stop-color:#9A7D0A" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#0a0a0a"/>
  
  <!-- Title -->
  <text x="500" y="45" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#6b7280" text-anchor="middle" letter-spacing="3">X-A BAND • SYMBOL CONCEPTS</text>
  
  <!-- OPTION A: X-A Shield -->
  <g transform="translate(130, 100)">
    <text x="70" y="0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">A: X-A SHIELD</text>
    
    <!-- Shield shape with X-A -->
    <g transform="translate(20, 20)">
      <!-- Shield outline -->
      <path d="M50 10 L90 25 L90 70 Q90 100 50 120 Q10 100 10 70 L10 25 Z" 
            fill="none" stroke="url(#gold)" stroke-width="4" filter="url(#glow)"/>
      <!-- X -->
      <text x="35" y="75" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="800" fill="url(#gold)">X</text>
      <!-- A -->
      <text x="55" y="75" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="800" fill="#dc2626">A</text>
    </g>
    
    <!-- On band preview -->
    <rect x="0" y="160" width="140" height="45" rx="22" fill="url(#gold)"/>
    <rect x="0" y="160" width="140" height="6" rx="3" fill="#1a1a1a"/>
    <rect x="0" y="199" width="140" height="6" rx="3" fill="#1a1a1a"/>
    <!-- Mini shield on band -->
    <path d="M25 175 L35 178 L35 190 Q35 198 25 203 Q15 198 15 190 L15 178 Z" 
          fill="#1a1a1a"/>
    <text x="21" y="193" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="800" fill="url(#gold)">XA</text>
    <!-- QR area -->
    <rect x="50" y="170" width="40" height="28" rx="4" fill="#1a1a1a"/>
    <rect x="54" y="174" width="32" height="20" rx="2" fill="white"/>
    
    <text x="70" y="235" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Protection + Brand</text>
  </g>
  
  <!-- OPTION B: Infinity Loop -->
  <g transform="translate(330, 100)">
    <text x="70" y="0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">B: INFINITY LOOP</text>
    
    <!-- Infinity symbol -->
    <g transform="translate(20, 40)">
      <path d="M25 40 Q25 20 50 20 Q75 20 75 40 Q75 60 100 60 Q125 60 125 40 Q125 20 100 20 Q75 20 75 40 Q75 60 50 60 Q25 60 25 40" 
            fill="none" stroke="url(#holoGradient)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    </g>
    
    <!-- On band preview -->
    <rect x="0" y="160" width="140" height="45" rx="22" fill="url(#gold)"/>
    <rect x="0" y="160" width="140" height="6" rx="3" fill="#1a1a1a"/>
    <rect x="0" y="199" width="140" height="6" rx="3" fill="#1a1a1a"/>
    <!-- Mini infinity -->
    <path d="M15 182 Q15 175 22 175 Q29 175 29 182 Q29 189 36 189 Q43 189 43 182 Q43 175 36 175 Q29 175 29 182 Q29 189 22 189 Q15 189 15 182" 
          fill="none" stroke="url(#holoGradient)" stroke-width="3" stroke-linecap="round"/>
    <!-- QR area -->
    <rect x="50" y="170" width="40" height="28" rx="4" fill="#1a1a1a"/>
    <rect x="54" y="174" width="32" height="20" rx="2" fill="white"/>
    
    <text x="70" y="235" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Neurodiversity Symbol</text>
  </g>
  
  <!-- OPTION C: Awareness Wave -->
  <g transform="translate(530, 100)">
    <text x="70" y="0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">C: AWARENESS WAVE</text>
    
    <!-- Wave symbol -->
    <g transform="translate(20, 35)">
      <path d="M10 50 Q35 20 60 50 Q85 80 110 50" 
            fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
      <circle cx="60" cy="50" r="8" fill="#dc2626"/>
    </g>
    
    <!-- On band preview -->
    <rect x="0" y="160" width="140" height="45" rx="22" fill="url(#gold)"/>
    <rect x="0" y="160" width="140" height="6" rx="3" fill="#1a1a1a"/>
    <rect x="0" y="199" width="140" height="6" rx="3" fill="#1a1a1a"/>
    <!-- Mini wave -->
    <path d="M12 182 Q20 172 28 182 Q36 192 44 182" 
          fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="28" cy="182" r="3" fill="#dc2626"/>
    <!-- QR area -->
    <rect x="50" y="170" width="40" height="28" rx="4" fill="#1a1a1a"/>
    <rect x="54" y="174" width="32" height="20" rx="2" fill="white"/>
    
    <text x="70" y="235" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Original + Calm</text>
  </g>
  
  <!-- OPTION D: QR Frame Icon -->
  <g transform="translate(730, 100)">
    <text x="70" y="0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">D: QR FRAME</text>
    
    <!-- Stylized QR frame -->
    <g transform="translate(20, 25)">
      <rect x="15" y="15" width="70" height="70" rx="10" fill="none" stroke="url(#gold)" stroke-width="4"/>
      <!-- Corner accents -->
      <path d="M15 35 L15 15 L35 15" fill="none" stroke="url(#holoGradient)" stroke-width="6" stroke-linecap="round"/>
      <path d="M65 15 L85 15 L85 35" fill="none" stroke="url(#holoGradient)" stroke-width="6" stroke-linecap="round"/>
      <path d="M85 65 L85 85 L65 85" fill="none" stroke="url(#holoGradient)" stroke-width="6" stroke-linecap="round"/>
      <path d="M35 85 L15 85 L15 65" fill="none" stroke="url(#holoGradient)" stroke-width="6" stroke-linecap="round"/>
      <!-- Center dot -->
      <circle cx="50" cy="50" r="10" fill="#dc2626"/>
    </g>
    
    <!-- On band preview -->
    <rect x="0" y="160" width="140" height="45" rx="22" fill="url(#gold)"/>
    <rect x="0" y="160" width="140" height="6" rx="3" fill="#1a1a1a"/>
    <rect x="0" y="199" width="140" height="6" rx="3" fill="#1a1a1a"/>
    <!-- Stylized QR on band -->
    <rect x="50" y="170" width="40" height="28" rx="4" fill="#1a1a1a"/>
    <rect x="54" y="174" width="32" height="20" rx="2" fill="white"/>
    <!-- Holo corners -->
    <path d="M50 175 L50 170 L55 170" fill="none" stroke="url(#holoGradient)" stroke-width="2"/>
    <path d="M85 170 L90 170 L90 175" fill="none" stroke="url(#holoGradient)" stroke-width="2"/>
    <path d="M90 193 L90 198 L85 198" fill="none" stroke="url(#holoGradient)" stroke-width="2"/>
    <path d="M55 198 L50 198 L50 193" fill="none" stroke="url(#holoGradient)" stroke-width="2"/>
    
    <text x="70" y="235" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">QR IS the Symbol</text>
  </g>
  
  <!-- HOLOGRAPHIC STRIP CONCEPT -->
  <g transform="translate(100, 320)">
    <text x="400" y="0" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">HOLOGRAPHIC STRIP CONCEPT</text>
    <text x="400" y="25" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Iridescent strip that catches light — impossible to ignore</text>
    
    <!-- Large band with holo strip -->
    <rect x="100" y="60" width="600" height="80" rx="40" fill="url(#gold)"/>
    <!-- Holographic strip -->
    <rect x="100" y="85" width="600" height="30" rx="0" fill="url(#holoGradient)" opacity="0.9"/>
    <!-- Black edges -->
    <rect x="100" y="60" width="600" height="10" rx="5" fill="#1a1a1a"/>
    <rect x="100" y="130" width="600" height="10" rx="5" fill="#1a1a1a"/>
    
    <!-- QR Code -->
    <rect x="350" y="70" width="100" height="60" rx="8" fill="#1a1a1a"/>
    <rect x="360" y="78" width="80" height="44" rx="4" fill="white"/>
    
    <!-- Symbol on left side -->
    <g transform="translate(160, 80)">
      <path d="M0 20 Q15 0 30 20 Q45 40 60 20" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
      <circle cx="30" cy="20" r="6" fill="#dc2626"/>
    </g>
    
    <!-- X-A text on right -->
    <text x="560" y="112" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#1a1a1a">X-A</text>
    
    <text x="400" y="175" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Gold band + Holographic rainbow strip + Symbol + QR + X-A branding</text>
  </g>
  
  <!-- Bottom options -->
  <g transform="translate(100, 530)">
    <text x="400" y="0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">WHICH DIRECTION SPEAKS TO YOU?</text>
    
    <text x="100" y="40" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">A: Shield</text>
    <text x="270" y="40" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">B: Infinity</text>
    <text x="440" y="40" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">C: Wave</text>
    <text x="610" y="40" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">D: QR Frame</text>
    <text x="750" y="40" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">E: Combine?</text>
  </g>
  
  <!-- Footer -->
  <text x="500" y="620" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#374151" text-anchor="middle">© 2026 X-A Corp</text>
</svg>
