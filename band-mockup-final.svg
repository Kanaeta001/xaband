<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <!-- Pearl white base with opalescent shimmer -->
    <linearGradient id="pearlWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="25%" style="stop-color:#f8f9ff"/>
      <stop offset="50%" style="stop-color:#fff8fb"/>
      <stop offset="75%" style="stop-color:#f8fffc"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
    
    <!-- Rainbow holographic gradient -->
    <linearGradient id="rainbowHolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444"/>
      <stop offset="20%" style="stop-color:#F59E0B"/>
      <stop offset="40%" style="stop-color:#FCD34D"/>
      <stop offset="60%" style="stop-color:#22C55E"/>
      <stop offset="80%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    
    <!-- Holographic shimmer for Embrace arms -->
    <linearGradient id="embraceHolo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="25%" style="stop-color:#764ba2"/>
      <stop offset="50%" style="stop-color:#f093fb"/>
      <stop offset="75%" style="stop-color:#4facfe"/>
      <stop offset="100%" style="stop-color:#43e97b"/>
    </linearGradient>
    
    <!-- Inner glow for center circle -->
    <linearGradient id="centerGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    
    <!-- Opalescent shimmer overlay -->
    <linearGradient id="opalShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,200,200,0.15)"/>
      <stop offset="33%" style="stop-color:rgba(200,255,200,0.15)"/>
      <stop offset="66%" style="stop-color:rgba(200,200,255,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(255,200,255,0.15)"/>
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.2"/>
    </filter>
    
    <!-- Soft glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#0a0a0a"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">X-A BAND — FINAL DESIGN</text>
  <text x="400" y="65" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Pearl White + Rainbow Holographic + The Embrace</text>
  
  <!-- Main Band - Flat/Unwrapped View -->
  <g transform="translate(100, 120)">
    <text x="300" y="-10" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">FLAT VIEW (Unwrapped)</text>
    
    <!-- Band base - Pearl White -->
    <rect x="0" y="0" width="600" height="80" rx="40" fill="url(#pearlWhite)" filter="url(#shadow)"/>
    
    <!-- Opalescent shimmer overlay -->
    <rect x="0" y="0" width="600" height="80" rx="40" fill="url(#opalShimmer)"/>
    
    <!-- Rainbow holographic accent strip - top -->
    <rect x="0" y="8" width="600" height="8" rx="4" fill="url(#rainbowHolo)" opacity="0.9"/>
    
    <!-- Rainbow holographic accent strip - bottom -->
    <rect x="0" y="64" width="600" height="8" rx="4" fill="url(#rainbowHolo)" opacity="0.9"/>
    
    <!-- === LEFT: THE EMBRACE SYMBOL (Rainbow Holographic) === -->
    <g transform="translate(70, 40)">
      <!-- Left arm -->
      <path d="M-25 25 Q-35 0 -10 -20" fill="none" stroke="url(#embraceHolo)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
      <!-- Right arm -->
      <path d="M25 25 Q35 0 10 -20" fill="none" stroke="url(#embraceHolo)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
      <!-- Center glow circle -->
      <circle cx="0" cy="5" r="14" fill="url(#centerGlow)" filter="url(#softGlow)"/>
      <circle cx="0" cy="5" r="7" fill="white"/>
    </g>
    
    <!-- === CENTER: QR CODE === -->
    <g transform="translate(250, 15)">
      <rect x="0" y="0" width="100" height="50" rx="8" fill="#1a1a2e"/>
      <rect x="6" y="6" width="88" height="38" rx="4" fill="white"/>
      
      <!-- QR code pattern (simplified) -->
      <g fill="#1a1a2e" transform="translate(12, 12)">
        <!-- Corner squares -->
        <rect x="0" y="0" width="14" height="14"/>
        <rect x="2" y="2" width="10" height="10" fill="white"/>
        <rect x="4" y="4" width="6" height="6" fill="#1a1a2e"/>
        
        <rect x="62" y="0" width="14" height="14"/>
        <rect x="64" y="2" width="10" height="10" fill="white"/>
        <rect x="66" y="4" width="6" height="6" fill="#1a1a2e"/>
        
        <rect x="0" y="12" width="14" height="14"/>
        <rect x="2" y="14" width="10" height="10" fill="white"/>
        <rect x="4" y="16" width="6" height="6" fill="#1a1a2e"/>
        
        <!-- Data dots -->
        <rect x="20" y="0" width="4" height="4"/>
        <rect x="28" y="0" width="4" height="4"/>
        <rect x="36" y="0" width="4" height="4"/>
        <rect x="48" y="0" width="4" height="4"/>
        <rect x="20" y="8" width="4" height="4"/>
        <rect x="32" y="8" width="4" height="4"/>
        <rect x="44" y="8" width="4" height="4"/>
        <rect x="56" y="8" width="4" height="4"/>
        <rect x="24" y="16" width="4" height="4"/>
        <rect x="36" y="16" width="4" height="4"/>
        <rect x="48" y="16" width="4" height="4"/>
        <rect x="62" y="16" width="4" height="4"/>
        <rect x="20" y="22" width="4" height="4"/>
        <rect x="32" y="22" width="4" height="4"/>
        <rect x="44" y="22" width="4" height="4"/>
        <rect x="56" y="22" width="4" height="4"/>
      </g>
    </g>
    
    <!-- === RIGHT: X-A TEXT (Rainbow Holographic) === -->
    <text x="480" y="52" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="900" fill="url(#rainbowHolo)" text-anchor="middle">X-A</text>
  </g>
  
  <!-- Wrist View (as worn) -->
  <g transform="translate(400, 350)">
    <text x="0" y="-60" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">ON WRIST</text>
    
    <!-- Band as oval/wrist shape - Pearl White -->
    <ellipse cx="0" cy="0" rx="140" ry="80" fill="none" stroke="url(#pearlWhite)" stroke-width="45" filter="url(#shadow)"/>
    
    <!-- Opalescent shimmer on wrist view -->
    <ellipse cx="0" cy="0" rx="140" ry="80" fill="none" stroke="url(#opalShimmer)" stroke-width="45"/>
    
    <!-- Rainbow holographic accent rings -->
    <ellipse cx="0" cy="0" rx="140" ry="80" fill="none" stroke="url(#rainbowHolo)" stroke-width="6" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="118" ry="58" fill="none" stroke="url(#rainbowHolo)" stroke-width="6" opacity="0.9"/>
    
    <!-- Top visible portion with elements -->
    <!-- Embrace symbol (rainbow holographic) -->
    <g transform="translate(-90, -15)">
      <path d="M-12 12 Q-18 0 -5 -10" fill="none" stroke="url(#embraceHolo)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M12 12 Q18 0 5 -10" fill="none" stroke="url(#embraceHolo)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
      <circle cx="0" cy="2" r="8" fill="url(#centerGlow)" filter="url(#softGlow)"/>
      <circle cx="0" cy="2" r="4" fill="white"/>
    </g>
    
    <!-- QR code on band -->
    <g transform="translate(-30, -22)">
      <rect x="0" y="0" width="60" height="35" rx="5" fill="#1a1a2e"/>
      <rect x="4" y="4" width="52" height="27" rx="3" fill="white"/>
    </g>
    
    <!-- X-A on right (rainbow holographic) -->
    <text x="75" y="5" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="900" fill="url(#rainbowHolo)">X-A</text>
  </g>
  
  <!-- Specs -->
  <g transform="translate(50, 430)">
    <text font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">
      <tspan x="0" y="0" font-weight="600" fill="white">MATERIAL:</tspan>
      <tspan> Waterproof Silicone</tspan>
    </text>
    <text font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">
      <tspan x="0" y="18" font-weight="600" fill="white">FINISH:</tspan>
      <tspan> Pearl white (opalescent) + Rainbow holographic accents</tspan>
    </text>
    <text font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">
      <tspan x="0" y="36" font-weight="600" fill="white">LAYOUT:</tspan>
      <tspan> The Embrace (left) | QR Code (center) | X-A (right)</tspan>
    </text>
    <text font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">
      <tspan x="0" y="54" font-weight="600" fill="white">QR LINK:</tspan>
      <tspan> xaband.band/p/[UNIQUE-ID]</tspan>
    </text>
  </g>
  
  <!-- X-A Corp footer -->
  <text x="750" y="480" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#374151" text-anchor="end">
    <tspan fill="#EF4444">X</tspan>-<tspan fill="#EF4444">A</tspan> CORP © 2026
  </text>
</svg>
