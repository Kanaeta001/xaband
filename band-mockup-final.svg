<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <!-- Rainbow gradient -->
    <linearGradient id="rainbowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444"/>
      <stop offset="20%" style="stop-color:#F59E0B"/>
      <stop offset="40%" style="stop-color:#FCD34D"/>
      <stop offset="60%" style="stop-color:#22C55E"/>
      <stop offset="80%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    
    <!-- Holographic shimmer effect -->
    <linearGradient id="holoShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0)"/>
      <stop offset="30%" style="stop-color:rgba(255,255,255,0.6)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.9)"/>
      <stop offset="70%" style="stop-color:rgba(255,255,255,0.6)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
    
    <!-- Glow effect for hologram -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="300" y="45" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle">X-A BAND</text>
  <text x="300" y="70" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">FINAL DESIGN — Rainbow + Holographic</text>
  
  <!-- Main Band Display -->
  <g transform="translate(300, 220)">
    <!-- Band shape - Rainbow base -->
    <ellipse cx="0" cy="0" rx="110" ry="130" fill="none" stroke="url(#rainbowGradient)" stroke-width="38" filter="url(#shadow)"/>
    
    <!-- Holographic white accents - multiple stripes -->
    <ellipse cx="0" cy="0" rx="110" ry="130" fill="none" stroke="url(#holoShimmer)" stroke-width="6" stroke-dasharray="20 40" filter="url(#glow)"/>
    <ellipse cx="0" cy="0" rx="110" ry="130" fill="none" stroke="url(#holoShimmer)" stroke-width="3" stroke-dasharray="10 30" stroke-dashoffset="25"/>
    
    <!-- Holographic sparkle dots -->
    <circle cx="-85" cy="-60" r="3" fill="white" opacity="0.9" filter="url(#glow)"/>
    <circle cx="70" cy="-90" r="2" fill="white" opacity="0.8" filter="url(#glow)"/>
    <circle cx="90" cy="40" r="3" fill="white" opacity="0.9" filter="url(#glow)"/>
    <circle cx="-60" cy="100" r="2" fill="white" opacity="0.7" filter="url(#glow)"/>
    <circle cx="30" cy="120" r="2" fill="white" opacity="0.8" filter="url(#glow)"/>
    
    <!-- QR Code housing -->
    <rect x="-45" y="-55" width="90" height="90" rx="10" fill="#1a1a2e" stroke="white" stroke-width="2"/>
    
    <!-- QR code white background -->
    <rect x="-38" y="-48" width="76" height="76" rx="6" fill="white"/>
    
    <!-- QR code pattern (simplified) -->
    <g fill="#1a1a2e">
      <!-- Corner squares -->
      <rect x="-32" y="-42" width="18" height="18"/>
      <rect x="-29" y="-39" width="12" height="12" fill="white"/>
      <rect x="-26" y="-36" width="6" height="6" fill="#1a1a2e"/>
      
      <rect x="14" y="-42" width="18" height="18"/>
      <rect x="17" y="-39" width="12" height="12" fill="white"/>
      <rect x="20" y="-36" width="6" height="6" fill="#1a1a2e"/>
      
      <rect x="-32" y="4" width="18" height="18"/>
      <rect x="-29" y="7" width="12" height="12" fill="white"/>
      <rect x="-26" y="10" width="6" height="6" fill="#1a1a2e"/>
      
      <!-- Data modules -->
      <rect x="-8" y="-42" width="4" height="4"/>
      <rect x="0" y="-42" width="4" height="4"/>
      <rect x="-8" y="-34" width="4" height="4"/>
      <rect x="4" y="-34" width="4" height="4"/>
      <rect x="-32" y="-18" width="4" height="4"/>
      <rect x="-24" y="-18" width="4" height="4"/>
      <rect x="-16" y="-18" width="4" height="4"/>
      <rect x="14" y="-18" width="4" height="4"/>
      <rect x="22" y="-18" width="4" height="4"/>
      <rect x="-8" y="-10" width="4" height="4"/>
      <rect x="0" y="-10" width="4" height="4"/>
      <rect x="8" y="-10" width="4" height="4"/>
      <rect x="-8" y="-2" width="4" height="4"/>
      <rect x="8" y="-2" width="4" height="4"/>
      <rect x="14" y="4" width="4" height="4"/>
      <rect x="22" y="4" width="4" height="4"/>
      <rect x="14" y="12" width="4" height="4"/>
      <rect x="26" y="12" width="4" height="4"/>
      <rect x="14" y="20" width="4" height="4"/>
      <rect x="22" y="20" width="4" height="4"/>
    </g>
    
    <!-- X-A logo below QR -->
    <text x="0" y="58" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">
      <tspan fill="#EF4444">X</tspan>-<tspan fill="#EF4444">A</tspan> BAND
    </text>
  </g>
  
  <!-- Specs Box -->
  <g transform="translate(300, 410)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
      <tspan font-weight="600" fill="white">Material:</tspan> Waterproof Silicone
    </text>
    <text x="0" y="22" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
      <tspan font-weight="600" fill="white">Finish:</tspan> Rainbow gradient + White holographic accents
    </text>
    <text x="0" y="44" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
      <tspan font-weight="600" fill="white">QR:</tspan> Links to xaband.band/p/[ID]
    </text>
  </g>
  
  <!-- Color palette reference -->
  <g transform="translate(50, 420)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">COLOR PALETTE</text>
    <rect x="0" y="8" width="20" height="12" rx="2" fill="#EF4444"/>
    <rect x="24" y="8" width="20" height="12" rx="2" fill="#F59E0B"/>
    <rect x="48" y="8" width="20" height="12" rx="2" fill="#FCD34D"/>
    <rect x="72" y="8" width="20" height="12" rx="2" fill="#22C55E"/>
    <rect x="96" y="8" width="20" height="12" rx="2" fill="#3B82F6"/>
    <rect x="120" y="8" width="20" height="12" rx="2" fill="#8B5CF6"/>
  </g>
  
  <!-- X-A Corp footer -->
  <text x="550" y="475" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="end">
    <tspan fill="#EF4444">X</tspan>-<tspan fill="#EF4444">A</tspan> CORP © 2026
  </text>
</svg>
