<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <!-- Holographic gradient -->
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea" />
      <stop offset="20%" style="stop-color:#764ba2" />
      <stop offset="40%" style="stop-color:#f093fb" />
      <stop offset="60%" style="stop-color:#4facfe" />
      <stop offset="80%" style="stop-color:#43e97b" />
      <stop offset="100%" style="stop-color:#667eea" />
    </linearGradient>
    
    <!-- Indigo accent -->
    <linearGradient id="indigoAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#4f46e5" />
    </linearGradient>
    
    <!-- Gold gradient -->
    <linearGradient id="goldBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d" />
      <stop offset="25%" style="stop-color:#f59e0b" />
      <stop offset="75%" style="stop-color:#d97706" />
      <stop offset="100%" style="stop-color:#b45309" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#0a0a0a"/>
  
  <!-- Header -->
  <text x="600" y="50" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="white" text-anchor="middle">X-A BAND • FINAL PRODUCTION DESIGN V1</text>
  <text x="600" y="80" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Safety & Dignity Bracelet for Autism & Special Needs</text>
  
  <!-- Main band - Large hero view -->
  <g transform="translate(100, 130)">
    <text x="500" y="0" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#9ca3af" text-anchor="middle">FLAT VIEW (ACTUAL PROPORTIONS)</text>
    
    <!-- Band body -->
    <rect x="50" y="30" width="900" height="100" rx="50" fill="url(#goldBand)" filter="url(#shadow)"/>
    
    <!-- Black edge - top -->
    <rect x="50" y="30" width="900" height="14" rx="7" fill="#1a1a1a"/>
    
    <!-- Black edge - bottom -->
    <rect x="50" y="116" width="900" height="14" rx="7" fill="#1a1a1a"/>
    
    <!-- Holographic strip -->
    <rect x="50" y="68" width="900" height="24" fill="url(#holo)" opacity="0.9"/>
    
    <!-- THE EMBRACE symbol (left side) -->
    <g transform="translate(120, 50)">
      <!-- Left arm -->
      <path d="M10 50 Q-5 28 25 5" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
      <!-- Right arm -->
      <path d="M80 50 Q95 28 65 5" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
      <!-- Center glow circle -->
      <circle cx="45" cy="30" r="16" fill="url(#indigoAccent)" filter="url(#glow)"/>
      <circle cx="45" cy="30" r="9" fill="white"/>
    </g>
    
    <!-- QR Code area (center) -->
    <rect x="400" y="45" width="200" height="70" rx="10" fill="#1a1a1a"/>
    <rect x="415" y="55" width="170" height="50" rx="6" fill="white"/>
    
    <!-- QR pattern (simplified representation) -->
    <g fill="#1a1a1a">
      <!-- Top row -->
      <rect x="425" y="62" width="14" height="14"/>
      <rect x="445" y="62" width="14" height="14"/>
      <rect x="465" y="62" width="14" height="14"/>
      <rect x="505" y="62" width="14" height="14"/>
      <rect x="525" y="62" width="14" height="14"/>
      <rect x="545" y="62" width="14" height="14"/>
      <rect x="565" y="62" width="14" height="14"/>
      <!-- Middle row -->
      <rect x="425" y="80" width="14" height="14"/>
      <rect x="465" y="80" width="14" height="14"/>
      <rect x="485" y="80" width="14" height="14"/>
      <rect x="525" y="80" width="14" height="14"/>
      <rect x="565" y="80" width="14" height="14"/>
      <!-- Bottom row -->
      <rect x="425" y="98" width="14" height="14"/>
      <rect x="445" y="98" width="14" height="14"/>
      <rect x="465" y="98" width="14" height="14"/>
      <rect x="505" y="98" width="14" height="14"/>
      <rect x="545" y="98" width="14" height="14"/>
      <rect x="565" y="98" width="14" height="14"/>
    </g>
    
    <!-- X-A branding (right side) -->
    <text x="780" y="95" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="800" fill="#1a1a1a">X-A</text>
  </g>
  
  <!-- Symbol detail -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="300" height="250" rx="16" fill="#111" stroke="#222" stroke-width="1"/>
    <text x="150" y="35" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">THE EMBRACE SYMBOL</text>
    
    <!-- Large symbol -->
    <g transform="translate(75, 60)">
      <path d="M20 110 Q-15 60 50 10" fill="none" stroke="url(#holo)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M130 110 Q165 60 100 10" fill="none" stroke="url(#holo)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
      <circle cx="75" cy="65" r="32" fill="url(#indigoAccent)" filter="url(#glow)"/>
      <circle cx="75" cy="65" r="18" fill="white"/>
    </g>
    
    <text x="150" y="215" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Two arms embracing = protection</text>
    <text x="150" y="232" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Glowing center = the individual valued</text>
  </g>
  
  <!-- Color specs -->
  <g transform="translate(430, 320)">
    <rect x="0" y="0" width="340" height="250" rx="16" fill="#111" stroke="#222" stroke-width="1"/>
    <text x="170" y="35" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">COLOR SPECIFICATION</text>
    
    <!-- Gold -->
    <rect x="25" y="60" width="60" height="40" rx="8" fill="#d97706"/>
    <text x="100" y="78" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="white">Gold (Primary)</text>
    <text x="100" y="95" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">Pantone 130 C / #D97706</text>
    
    <!-- Black -->
    <rect x="25" y="115" width="60" height="40" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="100" y="133" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="white">Black (Edges)</text>
    <text x="100" y="150" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">Pantone Black C / #1A1A1A</text>
    
    <!-- Holographic -->
    <rect x="25" y="170" width="60" height="40" rx="8" fill="url(#holo)"/>
    <text x="100" y="188" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="white">Holographic Strip</text>
    <text x="100" y="205" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">Rainbow iridescent film</text>
    
    <!-- Indigo -->
    <rect x="200" y="60" width="60" height="40" rx="8" fill="#4f46e5"/>
    <text x="270" y="78" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="white">Indigo</text>
    <text x="270" y="95" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">#4F46E5</text>
    
    <!-- White -->
    <rect x="200" y="115" width="60" height="40" rx="8" fill="white"/>
    <text x="270" y="133" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="white">White</text>
    <text x="270" y="150" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280">#FFFFFF</text>
  </g>
  
  <!-- Technical specs -->
  <g transform="translate(800, 320)">
    <rect x="0" y="0" width="300" height="250" rx="16" fill="#111" stroke="#222" stroke-width="1"/>
    <text x="150" y="35" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">TECHNICAL SPECS</text>
    
    <text x="25" y="70" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af">Material:</text>
    <text x="120" y="70" font-family="Inter, system-ui, sans-serif" font-size="12" fill="white">Medical-grade silicone</text>
    
    <text x="25" y="95" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af">Width:</text>
    <text x="120" y="95" font-family="Inter, system-ui, sans-serif" font-size="12" fill="white">20mm (adult) / 16mm (child)</text>
    
    <text x="25" y="120" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af">Thickness:</text>
    <text x="120" y="120" font-family="Inter, system-ui, sans-serif" font-size="12" fill="white">2.5mm</text>
    
    <text x="25" y="145" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af">Circumference:</text>
    <text x="120" y="145" font-family="Inter, system-ui, sans-serif" font-size="12" fill="white">Multiple sizes (S/M/L/XL)</text>
    
    <text x="25" y="170" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af">QR Plate:</text>
    <text x="120" y="170" font-family="Inter, system-ui, sans-serif" font-size="12" fill="white">50mm × 25mm laser-etched</text>
    
    <text x="25" y="195" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af">Waterproof:</text>
    <text x="120" y="195" font-family="Inter, system-ui, sans-serif" font-size="12" fill="white">Yes (IP67 rated)</text>
    
    <text x="25" y="220" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af">Closure:</text>
    <text x="120" y="220" font-family="Inter, system-ui, sans-serif" font-size="12" fill="white">Stretch fit / optional clasp</text>
  </g>
  
  <!-- Wrist mockup -->
  <g transform="translate(100, 600)">
    <text x="150" y="0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#9ca3af" text-anchor="middle">ON WRIST</text>
    
    <!-- Wrist circle -->
    <ellipse cx="150" cy="130" rx="100" ry="120" fill="none" stroke="#2a2a2a" stroke-width="50"/>
    
    <!-- Band on wrist -->
    <ellipse cx="150" cy="130" rx="85" ry="105" fill="none" stroke="url(#goldBand)" stroke-width="28" filter="url(#shadow)"/>
    <!-- Black edges -->
    <ellipse cx="150" cy="130" rx="85" ry="105" fill="none" stroke="#1a1a1a" stroke-width="4"/>
    <ellipse cx="150" cy="130" rx="71" ry="91" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Holo strip -->
    <ellipse cx="150" cy="130" rx="78" ry="98" fill="none" stroke="url(#holo)" stroke-width="8" opacity="0.85"/>
    
    <!-- QR on front -->
    <rect x="100" y="30" width="100" height="50" rx="8" fill="#1a1a1a"/>
    <rect x="108" y="38" width="84" height="34" rx="4" fill="white"/>
  </g>
  
  <!-- Size chart -->
  <g transform="translate(380, 600)">
    <text x="200" y="0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#9ca3af" text-anchor="middle">SIZE CHART</text>
    
    <rect x="0" y="20" width="400" height="200" rx="12" fill="#111" stroke="#222" stroke-width="1"/>
    
    <!-- Header row -->
    <text x="60" y="55" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle">SIZE</text>
    <text x="160" y="55" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle">WRIST (inches)</text>
    <text x="280" y="55" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6b7280" text-anchor="middle">RECOMMENDED</text>
    
    <line x1="20" y1="68" x2="380" y2="68" stroke="#333" stroke-width="1"/>
    
    <!-- Child Small -->
    <text x="60" y="95" font-family="Inter, system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle">Child S</text>
    <text x="160" y="95" font-family="Inter, system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle">4.5" - 5.0"</text>
    <text x="280" y="95" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Ages 3-6</text>
    
    <!-- Child Medium -->
    <text x="60" y="125" font-family="Inter, system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle">Child M</text>
    <text x="160" y="125" font-family="Inter, system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle">5.0" - 5.5"</text>
    <text x="280" y="125" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Ages 6-10</text>
    
    <!-- Youth -->
    <text x="60" y="155" font-family="Inter, system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle">Youth</text>
    <text x="160" y="155" font-family="Inter, system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle">5.5" - 6.5"</text>
    <text x="280" y="155" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Ages 10-14</text>
    
    <!-- Adult -->
    <text x="60" y="185" font-family="Inter, system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle">Adult</text>
    <text x="160" y="185" font-family="Inter, system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle">6.5" - 8.0"</text>
    <text x="280" y="185" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">Teens & Adults</text>
  </g>
  
  <!-- QR functionality -->
  <g transform="translate(820, 600)">
    <text x="150" y="0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#9ca3af" text-anchor="middle">QR CODE FUNCTION</text>
    
    <rect x="0" y="20" width="300" height="200" rx="12" fill="#111" stroke="#222" stroke-width="1"/>
    
    <text x="150" y="60" font-family="Inter, system-ui, sans-serif" font-size="13" fill="white" text-anchor="middle">Scan → Opens profile page:</text>
    
    <rect x="30" y="80" width="240" height="30" rx="6" fill="#1a1a1a"/>
    <text x="150" y="100" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4f46e5" text-anchor="middle">xaband.band/p/ABC123</text>
    
    <text x="40" y="140" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">• Name</text>
    <text x="40" y="158" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">• Communication tips</text>
    <text x="40" y="176" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">• Sensory needs</text>
    <text x="170" y="140" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">• Emergency contact</text>
    <text x="170" y="158" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">• Photo (optional)</text>
    <text x="170" y="176" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#9ca3af">• Custom notes</text>
    
    <text x="150" y="205" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">No app required • Works on any smartphone</text>
  </g>
  
  <!-- Footer -->
  <text x="600" y="860" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="white" text-anchor="middle">X-A BAND • SAFETY MEETS DIGNITY</text>
  <text x="600" y="885" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">© 2026 X-A Corp • X-TINCTION AGENDA • xtinctionagenda.com</text>
</svg>
